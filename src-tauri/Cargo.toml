[package]
name = "c-shell"
version = "0.6.0-beta1"
description = "A C programming IDE with retro terminal theme"
authors = ["Aaditya"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
portable-pty = "0.9.0"


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
