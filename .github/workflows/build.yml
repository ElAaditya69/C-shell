name: Release & CI Pipeline — C-Shell

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck & web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            artifact: c-shell-macos-universal
          - name: Windows (x64)
            os: windows-latest
            rust_targets: ''
            args: ''
            artifact: c-shell-windows-x64
          - name: Linux (x64)
            os: ubuntu-22.04
            rust_targets: ''
            args: ''
            artifact: c-shell-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential gcc
      - run: npm ci
      - name: Build application bundles
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: error

  # Resolve the release tag from the app version (tauri.conf.json) instead of
  # requiring a freshly pushed `v*` tag. This lets a beta be re-published under
  # the SAME version/tag (e.g. after fixing the bundles) without bumping.
  release-info:
    name: Resolve release tag
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      tag_exists: ${{ steps.info.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version and check for existing tag
        id: info
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          # Release under a distinct beta tag to avoid reusing the plain
              # version tag (which previously caused installers not to publish).
              echo "tag=${TAG}-beta" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

  publish-release:
    name: Publish GitHub release
    needs: [build, release-info]
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create needs a git repo for context.
      - uses: actions/checkout@v4
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-info.outputs.tag }}
          TAG_EXISTS: ${{ needs.release-info.outputs.tag_exists }}
        run: |
          set -euo pipefail

          # Re-releasing under the same version: force-move the existing
          # pre-release tag onto this build's commit so the release points at
          # the current code, then --force replaces the old release.
          if [[ "${TAG_EXISTS}" == "true" ]]; then
            echo "Reusing existing tag ${TAG}; force-moving it to this commit"
            git tag -f "${TAG}"
            git push origin "refs/tags/${TAG}" --force
          else
            echo "Creating new tag ${TAG}"
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

          # Only `gh release create` on the actual installer files. The
          # artifact unpacking can leave stray directories (e.g. a `release/`
          # folder), which gh refuses to upload.
          mapfile -d '' files < <(find release-assets -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' \) -print0)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No installer files found to publish"
            exit 1
          fi

          # --force replaces an existing release at this tag (deletes it and
          # recreates with the fresh artifacts + regenerated notes), so a beta
          # can be re-released in place rather than skipped.
          gh release create "${TAG}" "${files[@]}" \
            --title "C-Shell ${TAG}" \
            --prerelease \
            --generate-notes \
            --force
