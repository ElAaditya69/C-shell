name: Build C-Shell

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-22.04

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - run: npm install

      - uses: tauri-apps/tauri-action@v0

      - uses: actions/upload-artifact@v4
        with:
          name: C-Shell-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
